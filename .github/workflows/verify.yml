name: Verify reference library

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0, Node 24
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
      - run: python3 tools/references.py verify
      - run: python3 tools/glossary.py verify
