name: Refresh public reference sources

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reference-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0, Node 24
        with:
          persist-credentials: true
      - name: Fetch only approved sources
        run: python3 tools/references.py update
      - name: Verify source inventory and provenance
        run: python3 tools/references.py verify
      - name: Run offline and failure-path tests
        run: python3 -m unittest discover -s tests -v
      - name: Preserve the working glossary and human reading view
        run: python3 tools/glossary.py verify
      - name: Publish only a review branch and comparison link
        env:
          REFERENCE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 -m tools.publish_update_branch
